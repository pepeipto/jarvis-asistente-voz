<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="marco" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="top">
  <div class="marca">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path d="M16 2 28 9v14L16 30 4 23V9z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="4.2" fill="currentColor"/></svg>
    <div><b>J.A.R.V.I.S.</b><span id="ia-linea">Iniciando…</span></div>
  </div>
  <div class="reloj"><b id="hora">--:--</b><span id="fecha"></span></div>
</header>

<aside class="panel izq" aria-label="Cerebro">
  <h2>Cerebro</h2>
  <div class="cifra"><b id="n-notas">0</b><span>notas guardadas</span></div>
  <ul id="recientes"></ul>
</aside>

<aside class="panel der" aria-label="Sistema">
  <h2>Sistema</h2>
  <dl>
    <div><dt>Inteligencia</dt><dd id="s-ia">—</dd></div>
    <div><dt>Voz</dt><dd id="s-voz">—</dd></div>
    <div><dt>Micrófono</dt><dd id="s-mic">—</dd></div>
    <div><dt>Google</dt><dd id="s-google">—</dd></div>
    <div><dt>Activación</dt><dd id="s-wake">—</dd></div>
    <div><dt>Activo desde hace</dt><dd id="s-up">—</dd></div>
  </dl>
  <canvas id="traza" width="440" height="64" aria-hidden="true"></canvas>
</aside>

<main class="dock">
  <div id="estado" role="status" aria-live="polite">En línea</div>
  <canvas id="osc" width="720" height="44" aria-hidden="true"></canvas>
  <div id="chat" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input id="texto" type="text" placeholder="Escribe a Jarvis…" aria-label="Mensaje para Jarvis" maxlength="2000">
    <button type="submit" aria-label="Enviar">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 11.5 20.5 4 13 21.5l-2.2-7.3z" fill="currentColor"/></svg>
    </button>
  </form>
  <p class="pista">También puedes decir «Jarvis» y tu petición en voz alta.</p>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
